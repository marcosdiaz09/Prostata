<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Protocolo Desinflamación de Próstata</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=Great+Vibes&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  /* Paleta pensada para hombres de 45 a 70 que entran preocupados:
     marino para la autoridad, ámbar para la acción (se ve de lejos y no es médico),
     fondo arena y no blanco puro para que descanse la vista. */
  /* Tema calcado del original de BR (inlead): verde #16a34a, títulos #030712, texto #6b7280, fondo blanco. */
  --accion:#16a34a; --accion-osc:#15803d; --accion-cl:#dcfce7; --accion-bd:#86efac;
  --ok:#16a34a; --ok-cl:#ecfdf5; --ok-bd:#a7f3d0;
  --mal:#dc2626; --mal-cl:#fee2e2;
  --marino:#030712; --pizarra:#6b7280; --tenue:#9ca3af;
  --fondo:#ffffff; --blanco:#ffffff; --linea:#e5e7eb; --suave:#f3f4f6;
  --ambar:#b45309; --ambar-cl:#fff7ed; --ambar-bd:#fed7aa;
  --r:16px; --sombra:0 1px 2px rgba(3,7,18,.05),0 10px 28px rgba(3,7,18,.07);
}
html,body{background:var(--fondo);color:var(--marino)}
body{font:400 17px/1.5 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;overflow-x:hidden}
#app{max-width:28rem;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column}

/* ---------- barra superior ---------- */
.top{position:relative;z-index:40;background:var(--fondo);padding:8px 16px 0}
.top-row{display:flex;align-items:flex-start;justify-content:center;position:relative;min-height:36px}
.volver{position:absolute;left:0;top:0;width:36px;height:36px;flex:0 0 36px;border:0;background:transparent;cursor:pointer;
  display:flex;align-items:center;justify-content:center;border-radius:50%;color:var(--marino)}
.volver:active{background:var(--linea)}
.volver svg{width:22px;height:22px}
.marca-top{display:flex;align-items:center;gap:8px;font-family:"Great Vibes","Brush Script MT",cursive;font-weight:400;font-size:26px;color:#2F6B3C;-webkit-text-stroke:.6px #2F6B3C;text-transform:none;line-height:1;letter-spacing:0}
.marca-top svg{width:118px;height:auto;display:block}
.marca-top{padding:0}
.marca-top b{font-weight:400}
.logo-full{display:block;margin:0 auto}
.logo-full text{font-family:"Great Vibes","Brush Script MT",cursive;paint-order:stroke fill}
.barra{height:5px;background:var(--linea);border-radius:99px;margin:10px 0 0;overflow:hidden}
.barra > i{display:block;height:100%;background:var(--accion);border-radius:99px;transition:width .35s cubic-bezier(.4,0,.2,1)}
.top.oculta{display:none}

/* ---------- cuerpo ---------- */
main{flex:1;padding:18px 16px 40px}
.pant{animation:entra .3s ease both}
@keyframes entra{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.no-anim *{animation:none!important;transition:none!important}

h1,h2,h3{line-height:1.22;letter-spacing:-.015em;color:var(--marino)}
.h1{font-size:25px;font-weight:900;text-transform:uppercase;line-height:1.2;letter-spacing:-.01em}
.h1 mark{background:#111;color:#fff;padding:1px 7px;border-radius:4px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.sub em.v{font-weight:700}
.h2{font-size:24px;font-weight:800;margin-bottom:8px}
.h3{font-size:19px;font-weight:800;margin-bottom:6px}
.p{font-size:17px;color:var(--pizarra);line-height:1.55}
.p.chico{font-size:15px}
.c{text-align:center}
.sp{height:16px}.sp2{height:28px}
em.v{font-style:normal;color:var(--ok);font-weight:800}
em.a{font-style:normal;color:var(--ambar);font-weight:800}
mark{background:var(--marino);color:#fff;padding:0 6px;border-radius:4px}
.sub{font-size:16px;color:var(--pizarra);margin-top:10px;line-height:1.55}

/* ---------- botones ---------- */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:58px;border:0;border-radius:var(--r);
  padding:15px 18px;cursor:pointer;font-family:inherit;font-weight:800;font-size:20px;line-height:1.2;color:#fff;background:var(--accion);
  box-shadow:0 8px 22px rgba(22,163,74,.3);transition:transform .08s,background .15s;text-align:center}
.btn:active{transform:scale(.985);background:var(--accion-osc)}
.btn[disabled]{opacity:.4;box-shadow:none;cursor:default;animation:none}
.btn.pulsa{animation:pulsa 1.8s ease-in-out infinite}
@keyframes pulsa{0%,100%{box-shadow:0 8px 22px rgba(22,163,74,.3),0 0 0 0 rgba(22,163,74,.45)}
  60%{box-shadow:0 8px 22px rgba(22,163,74,.3),0 0 0 14px rgba(22,163,74,0)}}
.btn.alt{background:var(--blanco);color:var(--marino);border:2px solid var(--accion);box-shadow:none}
.btn.alt:active{background:var(--accion-cl)}
.btn.grande{min-height:68px;font-size:22px}
.botones{display:flex;flex-direction:column;gap:14px;margin-top:22px}
/* respuestas tipo botón: fondo blanco con borde verde, para que las 4 seguidas no griten */
.botones .btn.resp{background:var(--blanco);color:var(--marino);border:2px solid var(--ok-bd);box-shadow:var(--sombra);
  font-weight:700;font-size:18px;text-align:left;justify-content:flex-start;animation:cae .3s ease both}
.botones .btn.resp:active{border-color:var(--ok);background:var(--ok-cl)}
.cta-wrap{margin-top:26px}
.nota-cta{font-size:13px;color:var(--tenue);text-align:center;margin-top:10px}

/* ---------- opciones ---------- */
.ops{display:flex;flex-direction:column;gap:12px;margin-top:20px}
.op{display:flex;align-items:center;gap:14px;width:100%;text-align:left;cursor:pointer;
  background:var(--blanco);border:2px solid var(--linea);border-radius:var(--r);
  padding:15px 16px;font:inherit;color:inherit;transition:border-color .15s,background .15s,transform .08s;
  animation:cae .3s ease both;box-shadow:var(--sombra)}
@keyframes cae{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.op:active{transform:scale(.985)}
.op.on{border-color:var(--ok);background:var(--ok-cl)}
.op .ic{font-size:26px;line-height:1;flex:0 0 auto;width:34px;text-align:center}
.op .tx{flex:1;min-width:0}
.op .tt{font-weight:700;font-size:17px;line-height:1.3}
.op .st{font-size:14px;color:var(--pizarra);margin-top:3px;line-height:1.4}
.op .bx{flex:0 0 24px;width:24px;height:24px;border:2px solid var(--linea);border-radius:7px;
  display:flex;align-items:center;justify-content:center;background:var(--blanco)}
.op.on .bx{background:var(--ok);border-color:var(--ok)}
.op .bx svg{width:14px;height:14px;stroke:#fff;stroke-width:3.2;fill:none;opacity:0;transition:opacity .12s}
.op.on .bx svg{opacity:1}
.op .fl{flex:0 0 auto;color:var(--ok);font-size:22px;font-weight:800}
/* grilla con imagen (edad) */
.ops.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.op.img{flex-direction:column;align-items:stretch;padding:0;overflow:hidden;gap:0}
.op.img .ph{aspect-ratio:1/1;background:var(--suave) center/cover no-repeat;display:flex;align-items:center;justify-content:center;
  color:var(--tenue);font-size:11px;text-align:center;padding:8px;line-height:1.3}
.op.img .tt{padding:12px 10px;text-align:center;display:flex;align-items:center;justify-content:center;gap:6px;font-size:16px}
.op.img .tt:after{content:"›";font-size:22px;color:var(--ok);font-weight:800}

/* ---------- tarjetas y bloques ---------- */
.card{background:var(--blanco);border:1px solid var(--linea);border-radius:18px;padding:18px;margin-top:16px;box-shadow:var(--sombra)}
.aviso{border-radius:18px;padding:16px 18px;margin-top:16px;display:flex;gap:12px;align-items:flex-start}
.aviso.verde{background:var(--ok-cl);border:1px solid var(--ok-bd)}
.aviso.ambar{background:var(--ambar-cl);border:1px solid var(--ambar-bd)}
.aviso.blanco{background:var(--blanco);border:1px solid var(--linea);box-shadow:var(--sombra)}
.aviso .em{font-size:24px;line-height:1;flex:0 0 auto}
.aviso b{display:block;font-size:16px;margin-bottom:4px;color:var(--marino)}
.aviso p{font-size:15px;color:var(--pizarra);line-height:1.5}
.hueco{border:2px dashed var(--linea);border-radius:var(--r);padding:16px;text-align:center;color:var(--tenue);font-size:13px;line-height:1.45;background:var(--blanco);margin-top:16px}
.hueco b{display:block;color:var(--pizarra);margin-bottom:4px}
.hueco a{color:var(--ok)}
img.full{display:block;width:100%;border-radius:var(--r);margin-top:16px}
/* hero: grilla 2x2 con marco marino y etiqueta ámbar */
.hero{margin-top:30px;background:var(--accion);border-radius:22px;padding:8px;position:relative;box-shadow:0 14px 36px rgba(22,163,74,.25)}
.hero .g{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.hero .cel{border-radius:14px;overflow:hidden;background:var(--blanco);aspect-ratio:1/1;position:relative}
.hero .cel svg{display:block;width:100%;height:100%}
.hero .cel.ph{background:var(--suave) center/cover no-repeat;display:flex;align-items:flex-end;justify-content:center;color:var(--tenue);font-size:11px;text-align:center;padding:8px}
.hero .cel.ph span{background:rgba(3,7,18,.72);color:#fff;font-weight:800;font-size:12px;letter-spacing:.04em;padding:6px 10px;border-radius:99px;text-transform:uppercase}
.hero .cel.ph.vacia span{display:none}
.hero .badge{position:absolute;z-index:3;top:-15px;right:14px;background:#030712;color:#fff;font-weight:900;font-size:13px;letter-spacing:.06em;padding:7px 12px;border-radius:99px;box-shadow:0 4px 12px rgba(0,0,0,.2)}
.hero .pie{color:#fff;text-align:center;font-size:13px;font-weight:700;padding:10px 6px 4px;letter-spacing:.02em}
.hero .pie b{color:#bbf7d0}

/* chips de síntomas (pantalla 2) */
.chips-wrap{position:relative;margin-top:18px;background:var(--blanco);border:1px solid var(--linea);border-radius:18px;padding:18px 14px;box-shadow:var(--sombra)}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px}
.chip{background:var(--accion);color:#fff;font-weight:700;font-size:14px;padding:9px 13px;border-radius:99px;line-height:1.2}
.chip:nth-child(even){background:var(--accion-osc)}
.silueta{display:flex;justify-content:center}
.silueta svg{width:150px;height:auto}

/* audio tipo nota de voz */
.audio{display:flex;gap:12px;align-items:center;background:var(--blanco);border:1px solid var(--linea);border-radius:18px;padding:12px 14px;margin-top:14px;box-shadow:var(--sombra)}
.audio .av{width:46px;height:46px;border-radius:50%;flex:0 0 46px;background:var(--ok-cl) center/cover;display:flex;align-items:center;justify-content:center;color:var(--ok);font-weight:800}
.audio .play{width:42px;height:42px;border-radius:50%;border:0;background:var(--ok);color:#fff;flex:0 0 42px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.audio .play svg{width:18px;height:18px;fill:#fff}
.audio .play[disabled]{background:var(--linea)}
.audio .onda{flex:1;display:flex;align-items:center;gap:3px;height:34px}
.audio .onda i{display:block;width:3px;border-radius:2px;background:var(--ok-bd)}
.audio .onda i.on{background:var(--ok)}
.audio .quien{font-size:12px;color:var(--tenue);margin-top:2px}
.transcripcion{font-size:14px;color:var(--pizarra);line-height:1.55;background:var(--suave);border-radius:0 0 14px 14px;padding:12px 14px;margin:-6px 8px 0;border:1px solid var(--linea);border-top:0}
.transcripcion b{color:var(--marino)}

/* testimonios */
.testi{display:flex;gap:12px;align-items:flex-start;background:var(--blanco);border:1px solid var(--linea);border-radius:18px;padding:16px;margin-top:14px;box-shadow:var(--sombra)}
.testi .foto{width:52px;height:52px;border-radius:50%;flex:0 0 52px;background:var(--ok-cl) center/cover;display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--ok)}
.testi .q{font-size:15px;color:var(--pizarra);line-height:1.55}
.testi .n{font-weight:800;font-size:14px;color:var(--marino);margin-top:6px}
.testi .n span{font-weight:500;color:var(--tenue)}
.estrellas{color:#F59E0B;font-size:13px;letter-spacing:1px}

/* chats de WhatsApp (carrusel pantalla 23) */
.carrusel{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:18px -16px 0;padding:0 16px 8px;scrollbar-width:none}
.carrusel::-webkit-scrollbar{display:none}
.tel{flex:0 0 86%;scroll-snap-align:center;background:#111;border-radius:30px;padding:10px}
.tel .pantalla{background:#ECE5DD;border-radius:22px;overflow:hidden;min-height:380px;display:flex;flex-direction:column}
.tel .cab{background:#075E54;color:#fff;padding:12px 14px;display:flex;align-items:center;gap:10px;font-size:14px}
.tel .cab .av{width:30px;height:30px;border-radius:50%;background:#128C7E;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px}
.tel .cab small{display:block;font-size:11px;opacity:.8}
.tel .msgs{padding:12px;display:flex;flex-direction:column;gap:8px;flex:1}
.tel .m{max-width:84%;padding:8px 11px;border-radius:12px;font-size:13.5px;line-height:1.4;background:#fff;color:#111;align-self:flex-start;box-shadow:0 1px 1px rgba(0,0,0,.08)}
.tel .m.yo{background:#DCF8C6;align-self:flex-end}
.tel .m small{display:block;text-align:right;font-size:10px;color:#777;margin-top:2px}
.puntos{display:flex;justify-content:center;gap:6px;margin-top:8px}
.puntos i{width:7px;height:7px;border-radius:50%;background:var(--linea)}
.puntos i.on{background:var(--accion)}
.captura-testimonio{flex:0 0 86%;min-width:0;scroll-snap-align:center;overflow:hidden;border-radius:18px;background:#111;box-shadow:var(--sombra)}
.captura-testimonio img{display:block;width:100%;height:auto}


/* loaders (pantalla 26) */
.cargando{text-align:center;padding-top:20px}
.cargando .logo{width:120px;height:120px;margin:0 auto 18px}
.load{margin-top:18px;text-align:left}
.load .lab{display:flex;justify-content:space-between;font-size:14px;color:var(--pizarra);margin-bottom:6px}
.load .lab b{color:var(--marino)}
.load .pista{height:12px;background:var(--linea);border-radius:99px;overflow:hidden}
.load .pista i{display:block;height:100%;width:0;background:var(--accion);border-radius:99px;transition:width .25s linear}

/* medidores (pantallas 27 y 28) */
.metrica{margin-top:16px}
.metrica .lab{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;font-size:15px;color:var(--marino);font-weight:700;line-height:1.3}
.metrica .lab span{font-size:14px;color:var(--pizarra);font-weight:800;flex:0 0 auto}
.metrica .pista{height:12px;background:var(--linea);border-radius:99px;overflow:hidden;margin-top:7px;position:relative}
.metrica .pista i{display:block;height:100%;width:0;border-radius:99px;transition:width 1.1s cubic-bezier(.2,.7,.2,1)}
.metrica.roja .pista i{background:linear-gradient(90deg,#E8926F,var(--mal))}
.metrica.verde .pista i{background:linear-gradient(90deg,#7FC1D6,var(--ok))}
.metrica.gris .pista i{background:#B6C2CC}
.metrica .pista b{position:absolute;top:50%;width:18px;height:18px;border-radius:50%;background:#fff;border:3px solid currentColor;transform:translate(-50%,-50%);transition:left 1.1s cubic-bezier(.2,.7,.2,1)}
.metrica.roja .pista b{color:var(--mal)}.metrica.verde .pista b{color:var(--ok)}.metrica.gris .pista b{color:#94A3B8}

/* comparativa remedios vs protocolo */
.compara{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}
.compara > div{background:var(--blanco);border:2px solid var(--linea);border-radius:14px;padding:12px 10px}
.compara > div.si{border-color:var(--ok-bd);background:var(--ok-cl)}
.compara h4{font-size:15px;text-align:center;margin-bottom:10px;color:var(--marino);line-height:1.25}
.compara h4 i{display:block;font-style:normal;font-size:26px;margin-bottom:4px}
.compara ul{list-style:none;display:flex;flex-direction:column;gap:8px}
.compara li{font-size:13px;line-height:1.35;color:var(--pizarra);display:flex;gap:6px;align-items:flex-start}
.compara li:before{content:"✕";color:var(--mal);font-weight:900;flex:0 0 auto}
.compara .si li:before{content:"✓";color:var(--ok)}

/* paywall */
.banner-ok{background:var(--accion);color:#fff;border-radius:18px;padding:22px 18px;text-align:center;margin-top:14px;box-shadow:0 10px 30px rgba(22,163,74,.3)}
.banner-ok b{display:block;font-size:22px;font-weight:900;line-height:1.2}
.banner-ok span{display:inline-block;margin-top:10px;background:rgba(255,255,255,.2);color:#fff;padding:6px 14px;border-radius:99px;font-weight:800;font-size:15px}
.banner-ok .flecha{display:block;margin:12px auto 0;width:34px;height:34px}
.ad{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}
.ad .col{background:var(--blanco);border:1px solid var(--linea);border-radius:18px;overflow:hidden;box-shadow:var(--sombra)}
.ad .cab{padding:9px;text-align:center;font-weight:900;font-size:14px;letter-spacing:.06em;color:#fff}
.ad .col.antes .cab{background:#9CA3AF}.ad .col.despues .cab{background:var(--ok)}
.ad .ph{aspect-ratio:1/1;background:var(--suave) center/cover;display:flex;align-items:center;justify-content:center;color:var(--tenue);font-size:11px;text-align:center;padding:10px}
.ad .tx{padding:12px;font-size:13.5px;line-height:1.45;color:var(--pizarra)}
.ad .tx b{color:var(--marino)}
.ad .metrica{margin:0 12px 14px}
.stack{margin-top:14px;display:flex;flex-direction:column;gap:9px}
.stack .it{display:flex;align-items:center;gap:10px;background:var(--blanco);border:1px solid var(--linea);border-radius:14px;padding:12px 14px;box-shadow:var(--sombra)}
.stack .it .ok{color:var(--accion-osc);font-weight:900;font-size:18px;flex:0 0 auto}
.stack .it .nom{flex:1;font-size:15px;font-weight:600;color:var(--marino);line-height:1.3}
.stack .it .val{font-size:14px;color:var(--tenue);text-decoration:line-through;flex:0 0 auto}
.bonos-cab{margin-top:18px;text-align:center;font-weight:900;font-size:16px;color:var(--marino);letter-spacing:.02em}
.bonos-cab span{display:block;font-weight:600;font-size:13px;color:var(--accion-osc);margin-top:2px}
.stack.bonos .it{border:2px dashed var(--accion-bd);background:var(--accion-cl);align-items:flex-start}
.stack.bonos .num{flex:0 0 auto;background:var(--accion);color:#fff;font-weight:900;font-size:11px;letter-spacing:.06em;padding:4px 7px;border-radius:6px;margin-top:2px}
.stack.bonos .nom small{display:block;font-weight:400;font-size:13px;color:var(--pizarra);margin-top:3px;line-height:1.4}
.stack.bonos .val{text-decoration:none;text-align:right;line-height:1.2}
.stack.bonos .val s{display:block;font-size:12px;color:var(--tenue)}
.stack.bonos .val b{display:block;font-size:13px;color:var(--accion-osc);font-weight:900}
.recorte{margin-top:18px;background:#fff;border:1px solid #e5e7eb;border-radius:10px;overflow:hidden;box-shadow:0 10px 28px rgba(3,7,18,.10);font-family:Georgia,"Times New Roman",serif}
.recorte .cab{background:#111827;color:#fff;display:flex;justify-content:space-between;align-items:center;padding:9px 14px;font:800 12px/1 Inter,Arial,sans-serif;letter-spacing:.12em;text-transform:uppercase}
.recorte .cab span{opacity:.7;font-weight:600;letter-spacing:.04em;text-transform:none}
.recorte .cuerpo{padding:16px 16px 18px}
.recorte h4{font-size:22px;line-height:1.2;color:#030712;font-weight:700;margin-bottom:10px}
.recorte .bajada{font-size:15px;color:#374151;line-height:1.5;margin-bottom:12px}
.recorte .foto{aspect-ratio:16/9;background:#f3f4f6 center/cover no-repeat;border-radius:6px}
.recorte .epi{font:400 12px/1.4 Inter,Arial,sans-serif;color:#6b7280;margin:6px 0 12px}
.recorte p{font-size:15px;color:#1f2937;line-height:1.6;margin-top:8px}
.recorte .datos{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.recorte .datos div{background:#f9fafb;border-left:3px solid #dc2626;padding:9px 10px;font:600 13px/1.35 Inter,Arial,sans-serif;color:#111827}
.recorte .datos b{display:block;font-size:20px;color:#dc2626;font-weight:900}
.total{text-align:center;margin-top:18px}
.total .t1{font-size:16px;color:var(--pizarra)}
.total .t1 s{color:var(--tenue)}
.total .t2{font-size:15px;color:var(--pizarra);margin-top:8px}
.total .t3{font-size:44px;font-weight:900;color:var(--accion-osc);line-height:1;letter-spacing:-.02em;margin-top:4px}
.total .t4{font-size:13px;color:var(--tenue);margin-top:6px}
.sellos{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.sello{display:flex;gap:10px;align-items:flex-start;font-size:15px;color:var(--pizarra)}
.sello b{color:var(--marino)}
.sello .ok{color:var(--ok);font-weight:900;flex:0 0 auto}
.garantia{display:flex;gap:14px;align-items:center;background:linear-gradient(135deg,#111827,#1f2937);color:#fff;border-radius:18px;padding:18px;margin-top:18px}
.garantia .medalla{flex:0 0 84px;width:84px;height:84px}
.garantia b{display:block;font-size:17px;line-height:1.25}
.garantia p{font-size:14px;opacity:.9;margin-top:6px;line-height:1.45}
.precio-card{background:var(--blanco);border:2px solid var(--accion);border-radius:18px;padding:16px 18px;margin-top:18px;display:flex;align-items:center;justify-content:space-between;gap:12px;box-shadow:var(--sombra)}
.precio-card .l b{display:block;font-size:16px;color:var(--marino)}
.precio-card .l span{font-size:13px;color:var(--pizarra)}
.precio-card .r{text-align:right}
.precio-card .r b{display:block;font-size:26px;font-weight:900;color:var(--accion-osc);line-height:1}
.precio-card .r span{font-size:12px;color:var(--tenue)}
.lista-ok{list-style:none;margin-top:12px;display:flex;flex-direction:column;gap:10px}
.lista-ok li{position:relative;padding-left:30px;font-size:16px;color:var(--pizarra);line-height:1.45}
.lista-ok li:before{content:"✅";position:absolute;left:0;top:0}
.lista-ok li b{color:var(--marino)}
.riesgo{background:var(--suave);border:1px solid var(--linea);border-radius:18px;padding:22px 18px;text-align:center;margin-top:18px}
.riesgo svg{width:64px;height:64px;margin:0 auto 10px;display:block}
.riesgo b{display:block;font-size:18px;margin-bottom:10px}
.riesgo p{font-size:14.5px;color:var(--pizarra);line-height:1.55;text-transform:uppercase;letter-spacing:.01em}
.riesgo p strong{color:var(--marino)}
.video{margin:16px auto 0;border-radius:18px;overflow:hidden;background:#000;aspect-ratio:9/16;width:100%;max-width:300px}
.video iframe{width:100%;height:100%;border:0;display:block}
.legal{font-size:11.5px;line-height:1.55;color:var(--tenue);text-align:center;margin-top:26px;padding-bottom:10px}
.legal a{color:var(--tenue)}

function audio(w, clave){
  const a = CONFIG.audios[clave]; const v = CONFIG.voz;
  const barras = Array.from({length:34},(_,i)=>'<i style="height:'+(8+Math.abs(Math.sin(i*1.7))*22)+'px" class="'+(i<9?'on':'')+'"></i>').join("");
  const c = el("div","audio");

    '<button class="play" type="button" '+(a.src?'':'disabled')+' aria-label="Reproducir"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>'+
    '<div style="flex:1;min-width:0"><div class="onda">'+barras+'</div><div class="quien">'+v.nombre+' · '+v.rol+(a.src?'':' · nota de voz')+'</div></div>';
  w.appendChild(c);
  if(a.src){
    const au=new Audio(a.src); const pl=c.querySelector(".play"); const ondas=[...c.querySelectorAll(".onda i")];
    const PLAY='<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>', PAUSE='<svg viewBox="0 0 24 24"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>';
    const pinta=()=>{ pl.innerHTML=au.paused?PLAY:PAUSE; };
    au.ontimeupdate=()=>{ const k=au.duration?Math.round(au.currentTime/au.duration*ondas.length):0; ondas.forEach((o,i)=>o.classList.toggle("on",i<k)); };
    au.onplay=pinta; au.onpause=pinta; au.onended=()=>{ au.currentTime=0; pinta(); };
    pl.onclick=()=>{ au.paused ? au.play() : au.pause(); };
    ondas.forEach(o=>o.classList.remove("on"));
    // si el mp3 no existe o no se puede reproducir, mostramos el texto: nunca un botón muerto
    au.onerror=()=>{ if(c.nextSibling && c.nextSibling.classList && c.nextSibling.classList.contains("transcripcion")) return; pl.disabled=true; c.insertAdjacentElement("afterend", el("div","transcripcion",a.texto)); };
    // como el original ("si el audio no arranca, tocalo"): se intenta arrancar solo; si el navegador lo bloquea, queda el botón
    setTimeout(()=>{ if((window._audios||[]).includes(au)) au.play().catch(()=>{}); },400);
    if(!window._audios) window._audios=[]; window._audios.push(au);
  } else {
    w.appendChild(el("div","transcripcion",a.texto));
  }
}

function nivel(){
  const s=(S.r.sint||[]).length, c=(S.r.cond||[]).filter(x=>!x.startsWith("No tengo")).length;

}
